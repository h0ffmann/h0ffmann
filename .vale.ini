# Vale: the prose rules of this repository as rules that can fail. Part of `just md-quality`.
StylesPath = .vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = profile
# Not prose: HTML comments (the `cv:` markers), and the READMEs' HTML blocks of badges.
BlockIgnores = (?s)<!--.*?-->, (?s)<p align="left">.*?</p>, (?s)<div align="center">.*?</div>
# Not this repository's words: a quotation. A quotation may go over a line end, and never over an
# empty line.
TokenIgnores = ("[^"\n]*(\n[^"\n]+)*"), (“[^”\n]*(\n[^”\n]+)*”)
