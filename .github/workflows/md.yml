# .md — the discipline of the pages, on each pull request and each push to main, with tools from
# the flake's `md` shell (`just check`): the three analysers of the Markdown files
# (markdownlint-cli2, Vale, lychee for links to files), the slip box's rules, the source of
# every row of the site's tables, the citation file, and the licences (REUSE). No network here:
# web links are the `live links` workflow's. Each analyser is first given a bad file and must
# refuse it. The same checks as h0ffmann/closed-source and marola-dev/marola-research.
name: .md

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --no-update-lock-file .#md --command scripts/md-quality.sh --self-test
      - run: nix develop --no-update-lock-file .#md --command python3 scripts/citation.py --self-test
      - run: nix develop --no-update-lock-file .#md --command scripts/md-quality.sh
      - name: the slip box keeps its rules
        run: scripts/notes-check.sh
      - name: every row of the site's tables has its source
        run: scripts/sources-check.sh
      - name: CITATION.cff is the one .zenodo.json makes
        run: nix develop --no-update-lock-file .#md --command python3 scripts/citation.py --check
      - name: every file has a licence and a copyright
        run: nix develop --no-update-lock-file .#md --command reuse lint
