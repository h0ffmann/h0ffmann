# live links — lychee fetches every web link of the Markdown files (`just md-quality --online`).
# It passes only when 100% of the links answer. It runs on each pull request and each push to
# main, so main does not fail on a link that a pull request passed; and each Monday and by hand,
# because a page on the web can go away with no change here.
name: live links

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["metrics.*.svg", "pdf/**"]
  schedule:
    - cron: "11 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop --no-update-lock-file .#md --command scripts/md-quality.sh --online
        env:
          GITHUB_TOKEN: ${{ github.token }}
