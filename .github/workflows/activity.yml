name: activity

# Recent activity (pushes, PRs, issues, comments, releases) written between the
# <!--START_SECTION:activity--> / <!--END_SECTION:activity--> markers in README.md and
# README.pt-BR.md by scripts/build_activity.py. Uses METRICS_TOKEN (not GITHUB_TOKEN) so the
# user's own private events are included: private repositories show as a bare name with a lock
# and no links.
on:
  schedule:
    - cron: "0 7 * * *"          # daily, one hour after metrics.yml
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activity.yml"
      - "scripts/build_activity.py"

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: false

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: unit tests
        run: python3 -m unittest discover -s scripts -p 'test_build_activity.py' -v
      - name: rewrite the activity section
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 scripts/build_activity.py --readme README.md --readme README.pt-BR.md
      - name: commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md README.pt-BR.md; then echo "no change"; exit 0; fi
          git add README.md README.pt-BR.md
          git commit -m "Update recent activity - [Skip GitHub Action]"
          git pull --rebase origin main
          git push
