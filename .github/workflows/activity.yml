name: activity

# Recent public activity (issues, PRs, comments, releases) written between the
# <!--START_SECTION:activity--> / <!--END_SECTION:activity--> markers in README.md.
# Replaces lowlighter/metrics' activity plugin, which crashes on today's events API payloads.
on:
  schedule:
    - cron: "0 7 * * *"          # daily, one hour after metrics.yml
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/activity.yml"]

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: false

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jamesgeorge007/github-activity-readme@v0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          MAX_LINES: 5
          COMMIT_MSG: "Update recent activity - [Skip GitHub Action]"
          EMPTY_COMMIT_MSG: "Keep activity workflow alive - [Skip GitHub Action]"
