name: activity

# Recent activity (pushes, PRs, issues, comments, releases) written between the
# <!--START_SECTION:activity--> / <!--END_SECTION:activity--> markers in README.md and
# README.pt-BR.md by scripts/build_activity.py. Uses METRICS_TOKEN (not GITHUB_TOKEN) so the
# user's own private events are included: private repositories show as a bare name with a lock
# and no links.
#
# Push, not only poll: nix-config's profile-ping.yml sends a repository_dispatch (`activity`) after
# every merged PR in nix-config, marola, ww3-gpu and gcp-agentic-architect; its payload names the
# merge, so it shows even while the events API lags. The daily cron stays as the fallback.
on:
  schedule:
    - cron: "0 7 * * *"          # daily, one hour after metrics.yml
  repository_dispatch:
    types: [activity]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activity.yml"
      - "scripts/build_activity.py"

permissions:
  contents: write

# One group for every workflow that commits to main, so their pushes never race.
concurrency:
  group: readme-bots
  cancel-in-progress: false

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: unit tests
        run: python3 -m unittest discover -s scripts -p 'test_build_activity.py' -v
      - name: rewrite the activity section
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          DISPATCH: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || '' }}
        run: python3 scripts/build_activity.py --limit 10 --dispatch-json "$DISPATCH" --readme README.md --readme README.pt-BR.md --readme README.ja.md
      - name: commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md README.pt-BR.md README.ja.md; then echo "no change"; exit 0; fi
          git add README.md README.pt-BR.md README.ja.md
          git commit -m "Update recent activity - [Skip GitHub Action]"
          git pull --rebase origin main
          git push
