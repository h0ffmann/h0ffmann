name: metrics

on:
  schedule:
    - cron: "0 6 * * *"          # daily, 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # 1) total contributions — all time, not just the trailing 12 months
      - name: all-time contributions
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.base.svg
          base: header, activity, community, repositories
          base_indepth: yes                 # sums contributions since account creation
          config_timezone: America/Sao_Paulo
          plugin_lines: yes                 # lines of code changed, all time

      # 2) most used languages — clones and analyses every repo you committed to
      - name: languages (all time)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: html, css, jupyter notebook, shell, makefile, dockerfile

      # 3) git activity per year — one contribution calendar per year since account creation
      - name: activity per year
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.calendar.svg
          base: ""
          config_timezone: America/Sao_Paulo
          plugin_calendar: yes
          plugin_calendar_limit: 0          # 0 = full history
