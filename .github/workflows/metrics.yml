name: metrics

on:
  schedule:
    - cron: "0 6 * * *"          # daily, 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # 1) base stats — account age, followers, all-time commits
      - name: all-time contributions
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.base.svg
          base: header, activity
          base_indepth: yes                 # sums contributions since account creation
          config_timezone: America/Sao_Paulo

      # 2) most used languages — clones and analyses every repo you committed to
      - name: languages (all time)
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          # indepth matches commits with `git log --author=<identifier>`; the default identifier
          # is the login "h0ffmann", which matches nothing because every commit is authored as
          # hoffmann@poli.ufrj.br (see #1's follow-up). The email is already on every public commit.
          commits_authoring: h0ffmann, hoffmann@poli.ufrj.br
          plugin_languages_analysis_timeout: 15
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: html, css, jupyter notebook, shell, makefile, dockerfile
