# site — publish www/dist (the Markdown site, `just www`, committed) to GitHub Pages from main.
# The Gleam site of site/ is no longer published here (the owner, 13 November 2026).
# Needs Settings → Pages → Source: GitHub Actions. Python only, no Nix.
# It commits nothing, so it is not in the `readme-bots` group.
name: site

# CI is off (the owner, 29 October 2026): the workflow runs only when started by hand.
# To turn it back on, replace this block with the commented triggers below.
on:
  workflow_dispatch:

# on:
#   pull_request:
#   push:
#     branches: [main]
#     paths: ["www/**", ".github/workflows/site.yml"]
#   # Each morning, after the metrics workflow wrote its two cards (06:00 UTC): the page reads its
#   # numbers from them, and that workflow's commits do not start this one.
#   schedule:
#     - cron: "40 6 * * *"
#   workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: www/dist is what www/content makes
        run: python3 www/build.py --check
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: www/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
