name: cv

# The four CVs of pdf/, built again on main and committed back: the short CV names in its foot
# the commit it was built from, and only a build on main knows the commit of main. A pull request
# commits its own PDFs (`just cv`) and `pdf / build` checks them, so this job changes one line of
# one PDF. Built in the Nix sandbox by nix-config's labs/publisher. Bot pushes use the Actions
# token and never trigger this; only hand edits to the README, cv/ or the flake do.
# CI is off (the owner, 29 October 2026): the workflow runs only when started by hand.
# To turn it back on, replace this block with the commented triggers below.
on:
  workflow_dispatch:

# on:
#   push:
#     branches: [main]
#     paths:
#       - README.md
#       - README.pt-BR.md
#       - README.ja.md
#       - me/**
#       - site/data/**
#       - cv/**
#       - flake.nix
#       - flake.lock
#       - .github/workflows/cv.yml
#   workflow_dispatch:

permissions:
  contents: write

# One group for every workflow that commits to main, so their pushes never race.
concurrency:
  group: readme-bots
  cancel-in-progress: false

jobs:
  cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: h0ffmann/nix-config/labs/publisher@main
        with:
          pdf-dir: pdf
          artifact-name: cv
          commit: "true"
          commit-message: "Update cv.pdf - [Skip GitHub Action]"
