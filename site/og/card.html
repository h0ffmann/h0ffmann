<!doctype html>
<!-- The picture that a link to the site shows in a chat or a feed (LinkedIn, WhatsApp, Slack):
     site/static/og.png, 1200 by 627, the size LinkedIn asks for. It follows DESIGN.md (the site since
     11 November 2026): piabrota's dark ground and red, the name, the motto, the three areas.
     Every word is inside the middle, so a square crop loses only the drawing.
     Make it again as site/og/README.md says. -->
<html lang="en">
<meta charset="utf-8">
<title>h0ffmann: the link preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Inter:wght@600&family=JetBrains+Mono&display=block">
<style>
  :root { --bg: #0B0D12; --text: #EDEFF3; --muted: #9AA3B2; --border: #2A303C; --accent: #BC2318; --accent-text: #FF6B5E; --sea: #5AA9E6; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 627px; overflow: hidden; background: var(--bg); }
  .card { position: relative; width: 1200px; height: 627px; padding: 70px 80px; background: radial-gradient(60rem 22rem at 8% -30%, rgba(188, 35, 24, .30), transparent 70%), var(--bg); }
  .imprint { font: 600 18px/1 Inter, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-text); }
  h1 { margin-top: 40px; font: 400 176px/.92 'Fjalla One', sans-serif; color: var(--text); }
  .motto { margin-top: 10px; font: italic 400 44px/1.2 Georgia, serif; color: var(--accent-text); }
  .areas { position: absolute; left: 80px; bottom: 62px; display: flex; gap: 14px; font: 400 20px/1 'JetBrains Mono', monospace; }
  .areas span { padding: 11px 18px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); background: #14171F; }
  .drawing { position: absolute; right: 70px; top: 110px; width: 280px; aspect-ratio: 6 / 7; background: var(--sea);
    -webkit-mask: url(../static/drawings/prometheus.svg) no-repeat center / contain; mask: url(../static/drawings/prometheus.svg) no-repeat center / contain; }
</style>
<div class="card">
  <p class="imprint">matheus hoffmann / me.piabrota.art</p>
  <h1>h0ffmann</h1>
  <p class="motto">the art of the maintenance of apps</p>
  <p class="areas"><span class="w">wave modelling</span><span class="i">game theory</span><span class="o">self-improving apps</span></p>
  <div class="drawing"></div>
</div>
</html>
